services:
  - type: web
    name: tik-live-ai-backend
    runtime: node
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PERXONA_API_BASE_URL
        value: https://console.perxona.ai/asia
      - key: PERXONA_CONNECT_SECRET_KEY
        sync: false
      - key: PERXONA_CONNECT_PUBLISHABLE_KEY
        sync: false
      - key: LIVE_ADMIN_TOKEN
        generateValue: true
      - key: EULER_API_KEY
        sync: false
      - key: FRONTEND_ORIGINS
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: LLM_PROVIDER
        value: groq
      - key: GROQ_TEXT_MODEL
        value: openai/gpt-oss-20b
      - key: SCREEN_CAPTURE_WEBHOOK_TOKEN
        generateValue: true
      - key: SCREEN_CAPTURE_LLM_TIMEOUT_MS
        value: "12000"
      - key: OPENAI_API_KEY
        sync: false
      - key: LIVE_HOST_NAME
        value: "[HOST_NAME]"
      - key: LIVE_BRAND_NAME
        value: "[BRAND_NAME]"
      - key: MONGODB_URI
        sync: false
