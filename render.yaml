services:
  - type: web
    name: tik-live-ai-backend
    runtime: node
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PERXONA_API_BASE_URL
        value: https://console.perxona.ai/asia
      - key: PERXONA_CONNECT_SECRET_KEY
        sync: false
      - key: PERXONA_CONNECT_PUBLISHABLE_KEY
        sync: false
      - key: LIVE_ADMIN_TOKEN
        generateValue: true
      - key: EULER_API_KEY
        sync: false
      - key: FRONTEND_ORIGINS
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: LLM_PROVIDER
        value: groq
      - key: GROQ_TEXT_MODEL
        value: openai/gpt-oss-20b
      - key: GROQ_VISION_MODEL
        value: qwen/qwen3.8-27b
      - key: GROQ_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_VISION_MODEL
        value: gpt-4o-mini
      - key: OPENAI_VISION_BASE_URL
        value: https://api.openai.com/v1/chat/completions
      - key: LIVE_HOST_NAME
        value: "[HOST_NAME]"
      - key: LIVE_BRAND_NAME
        value: "[BRAND_NAME]"
      - key: MONGODB_URI
        sync: false
